<div class="follow-btn-container d-flex justify-content-between mt-3">
  <button
    class="btn flex-grow-1 follow-btn"
    [class.active]="currentChoice === choice1"
    (click)="selectChoice(choice1)"
  >
    {{ choice1 }}
  </button>
  <button
    class="btn flex-grow-1 follow-btn"
    [class.active]="currentChoice === choice2"
    (click)="selectChoice(choice2)"
  >
    {{ choice2 }}
  </button>
</div>
