<div class="d-flex flex-column mt-3">
  <div
    class="d-flex flex-column bg-white rounded shadow-sm mb-3 overflow-hidden"
  >
    <!-- ภาพพื้นหลัง -->
    <img
      [src]="group_data.image_url"
      alt="Group Image"
      class="w-100"
      style="height: 180px; object-fit: cover"
    />

    <!-- ส่วนรายละเอียด -->
    <div class="p-3 bg-white">
      <!-- ชื่อกลุ่ม -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <h5 class="mb-0 fw-semibold">{{ group_data.name }}</h5>
          <small class="text-muted"
            >{{ group_data.members_count }} members</small
          >
        </div>
        <div>
          <i class="bi bi-gear-fill"></i>
          <!-- ฟันเฟือง -->
        </div>
      </div>
    </div>

    <!-- ปุ่ม Joined + Invite -->
    <div class="d-flex gap-2 mb-3 px-2">
      <!-- Leave Group Dropdown -->
      <div ngbDropdown class="dropdown flex-fill">
        <button class="btn btn-light w-100" ngbDropdownToggle>Joined</button>
        <div ngbDropdownMenu class="w-100 p-0">
          <button
            class="btn btn-danger w-100 text-white"
            (click)="Leave_group()"
          >
            Leave group
          </button>
        </div>
      </div>

      <!-- Invite Button -->
      <button
        class="btn text-white flex-fill fw-medium"
        style="background-color: #8fbcd4; border: none"
        (click)="invite_people()"
      >
        Invite
      </button>
    </div>

    <!-- Tabs -->
    <div class="d-flex justify-content-between my-2">
      <button class="btn btn-light rounded-pill flex-fill mx-1 py-2 fw-medium">
        You
      </button>
      <button class="btn btn-light rounded-pill flex-fill mx-1 py-2 fw-medium">
        About
      </button>
      <button class="btn btn-light rounded-pill flex-fill mx-1 py-2 fw-medium">
        People
      </button>
      <button class="btn btn-light rounded-pill flex-fill mx-1 py-2 fw-medium">
        Chats
      </button>
    </div>
  </div>
</div>
<app-create-post
  [placeholderText]="'Create post in ' + group_data.name"
  [State]="'creategrouppost'"
  [group_id]="group_data.id"
></app-create-post>

<ng-container *ngFor="let post of group_data.posts">
  <app-post
    [group_post]="post"
    (postUpdated)="onPostUpdated($event)"
    type="group"
  ></app-post>
</ng-container>
