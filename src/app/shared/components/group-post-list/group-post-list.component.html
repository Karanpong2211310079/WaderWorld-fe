<div class="d-flex flex-column mt-3">
  <div
    class="d-flex flex-column bg-white rounded shadow-sm mb-3 overflow-hidden"
  >
    <!-- ภาพพื้นหลัง -->
    <img
      [src]="group_data.image_url"
      alt="Group Image"
      class="w-100"
      style="height: 180px; object-fit: cover"
    />

    <!-- ส่วนรายละเอียดชื่อกลุ่ม -->
    <div class="p-3 bg-white">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <h3 class="mb-0 fw-semibold">{{ group_data.name }}</h3>
          <small class="text-muted"
            >{{ group_data.members_count }} Members</small
          >
        </div>
        <div *ngIf="is_member">
          <i class="bi bi-gear-fill"></i>
        </div>
      </div>

      <!-- Group Detail Section -->
      <div class="bg-light rounded p-3 mb-3">
        <p class="mb-2">
          <strong>Description:</strong>
          {{ group_data.description || "No description yet." }}
        </p>
        <p class="mb-2">
          <strong>Privacy:</strong> {{ checkType(group_data.type) }}
        </p>
        <p class="mb-2">
          <strong>Created At:</strong>
          {{ calculation_time(group_data.created_at) }}
        </p>

        <div class="d-flex flex-wrap gap-2 mt-2">
          <strong class="me-2">Category:</strong>
          <span
            *ngFor="let cat of group_data.category.split(',')"
            class="badge"
            [ngClass]="getCategoryBadgeClass(cat)"
          >
            {{ getCategoryDisplayName(cat) }}
          </span>
        </div>
      </div>
    </div>

    <!-- ถ้าเป็นสมาชิก -->
    <div *ngIf="is_member" class="d-flex gap-2 mb-3 px-2">
      <div ngbDropdown class="dropdown flex-fill">
        <button class="btn btn-light w-100" ngbDropdownToggle>Joined</button>
        <div ngbDropdownMenu class="w-100 p-0">
          <button
            class="btn btn-danger w-100 text-white"
            (click)="Leave_group()"
          >
            Leave group
          </button>
        </div>
      </div>

      <button
        class="btn text-white flex-fill fw-medium"
        style="background-color: #8fbcd4; border: none"
        (click)="invite_people()"
      >
        Invite
      </button>
    </div>

    <!-- Tabs เฉพาะสมาชิก -->
    <div *ngIf="is_member" class="d-flex justify-content-between my-2">
      <button class="btn btn-light rounded-pill flex-fill mx-1 py-2 fw-medium">
        You
      </button>
      <button class="btn btn-light rounded-pill flex-fill mx-1 py-2 fw-medium">
        About
      </button>
      <button
        *ngIf="is_admin_group"
        class="btn btn-light rounded-pill flex-fill mx-1 py-2 fw-medium"
        (click)="PeopleGroup()"
      >
        People
      </button>
      <button class="btn btn-light rounded-pill flex-fill mx-1 py-2 fw-medium">
        Chats
      </button>
    </div>

    <!-- ถ้าไม่เป็นสมาชิก -->
    <div *ngIf="!is_member" class="d-flex justify-content-center my-3">
      <button
        class="btn btn-primary fw-semibold"
        (click)="RequestJoined($event, group_data.id)"
      >
        Request to Join Group
      </button>
    </div>
  </div>
</div>

<!-- Create Post เฉพาะสมาชิก -->
<app-create-post
  *ngIf="is_member"
  [placeholderText]="'Create post in ' + group_data.name"
  [State]="'creategrouppost'"
  [group_id]="group_data.id"
></app-create-post>

<!-- Posts List เฉพาะสมาชิก -->
<ng-container *ngFor="let post of group_data.posts">
  <app-post
    [group_post]="post"
    (postUpdated)="onPostUpdated($event)"
    type="group"
  ></app-post>
</ng-container>
