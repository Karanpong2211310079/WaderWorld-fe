<div class="container mt-4">
  <div class="d-flex flex-column rounded shadow-sm p-3 bg-white mt-3">
    <!-- Row: avatar + name left, icon right -->
    <div class="d-flex align-items-center justify-content-between mb-3">
      <div class="d-flex align-items-center gap-2">
        <button
          type="button"
          class="btn btn-sm btn-outline-secondary position-absolute top-0 end-0 m-2"
          (click)="closeModal()"
          title="Close"
        >
          ✖
        </button>

        <!-- ✅ แก้ไขการแสดงรูปโปรไฟล์ -->
        <div class="profile-image-wrapper">
          <img
            *ngIf="
              group_post.user_profile_image_url &&
              group_post.user_profile_image_url.trim() !== ''
            "
            class="rounded-circle img-fluid"
            width="50"
            height="50"
            [src]="group_post.user_profile_image_url"
            [alt]="group_post.username"
            (error)="onImageError($event)"
          />
          <div
            *ngIf="
              !group_post.user_profile_image_url ||
              group_post.user_profile_image_url.trim() === ''
            "
            class="rounded-circle default-avatar d-flex align-items-center justify-content-center"
            style="
              width: 50px;
              height: 50px;
              background-color: #6c757d;
              color: white;
            "
          >
            <i class="bi bi-person-fill"></i>
          </div>
        </div>

        <div>
          <h3 class="mb-0">{{ group_post.username }}</h3>
          <small>Date : {{ calculation_time(group_post.created_at) }}</small>
        </div>
      </div>
    </div>

    <div class="mb-3">
      <p>{{ group_post.content }}</p>

      <!-- ✅ แก้ไขการแสดงรูปโพสต์ -->
      <img
        *ngIf="group_post.media_url && group_post.media_url.trim() !== ''"
        style="max-height: 400px; object-fit: cover; width: 100%"
        class="img-fluid rounded"
        [src]="group_post.media_url"
        alt="Post image"
        (error)="onPostImageError($event)"
      />
    </div>

    <div
      class="d-flex align-items-center justify-content-between mt-3 pt-2 border-top"
    >
      <!-- Left side: Like + Comment -->
      <div class="d-flex align-items-center gap-3">
        <!-- Like -->
        <div
          class="d-flex align-items-center gap-1"
          style="cursor: pointer"
          (click)="onLike()"
        >
          <i class="bi bi-heart"></i>
          <span>{{ group_post.like_count || 0 }} likes</span>
        </div>
      </div>

      <!-- Right side: Bookmark -->
      <div style="cursor: pointer">
        <i class="bi bi-bookmark"></i>
      </div>
    </div>
  </div>

  <!-- ✅ ส่วนคอมเมนต์ - ใช้ *ngFor แทน @for -->
  <div
    *ngFor="let item of comment; let i = index"
    class="d-flex align-items-start border rounded p-3 mb-3"
  >
    <!-- ✅ แก้ไขการแสดงรูปโปรไฟล์ในคอมเมนต์ -->
    <div class="profile-image-wrapper me-3">
      <img
        *ngIf="
          item.user_profile_image_url &&
          item.user_profile_image_url.trim() !== ''
        "
        [src]="item.user_profile_image_url"
        class="rounded-circle"
        width="50"
        height="50"
        [alt]="item.username"
        (error)="onCommentImageError($event)"
      />
      <div
        *ngIf="
          !item.user_profile_image_url ||
          item.user_profile_image_url.trim() === ''
        "
        class="rounded-circle default-avatar d-flex align-items-center justify-content-center"
        style="
          width: 50px;
          height: 50px;
          background-color: #6c757d;
          color: white;
        "
      >
        <i class="bi bi-person-fill"></i>
      </div>
    </div>

    <div>
      <h6 class="mb-1 fw-bold">
        {{ item.username }}
        <small class="text-muted"
          >· {{ calculation_time(item.created_at) }}</small
        >
      </h6>
      <p class="mb-0">{{ item.content }}</p>
    </div>
  </div>

  <!-- ✅ ช่องพิมพ์คอมเมนต์ -->
  <div
    [formGroup]="commentForm"
    class="d-flex align-items-center border rounded p-2"
  >
    <!-- ✅ แก้ไขการแสดงรูปผู้ใช้ -->
    <div class="profile-image-wrapper me-2">
      <img
        *ngIf="userImage && userImage.trim() !== ''"
        [src]="userImage"
        class="rounded-circle"
        width="40"
        height="40"
        alt="you"
        (error)="onUserImageError($event)"
      />
      <div
        *ngIf="!userImage || userImage.trim() === ''"
        class="rounded-circle default-avatar d-flex align-items-center justify-content-center"
        style="
          width: 40px;
          height: 40px;
          background-color: #6c757d;
          color: white;
        "
      >
        <i class="bi bi-person-fill"></i>
      </div>
    </div>

    <input
      type="text"
      class="form-control me-2"
      placeholder="Write a comment..."
      formControlName="comment"
    />

    <button
      (click)="create_comment()"
      class="btn btn-primary d-flex align-items-center justify-content-center"
      [disabled]="commentForm.invalid"
    >
      <i class="bi bi-send"></i>
    </button>
  </div>
</div>
