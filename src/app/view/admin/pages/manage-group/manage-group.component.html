<div class="container">
  <div class="table-card mt-3">
    <h2>Manage Groups</h2>
    <table class="table table-bordered table-hover mb-0 align-middle">
      <thead class="thead-light">
        <tr>
          <th>ID</th>
          <th>Image</th>
          <th>Name</th>
          <th>Description</th>
          <th>Members</th>
          <th>Created At</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <!-- Loop through groups -->
        <tr *ngFor="let item of Group_Data; let i = index">
          <td>{{ i + 1 }}</td>
          <td>
            <img
              [src]="item.image_url"
              alt="{{ item.name }}"
              class="rounded-circle"
              width="50"
              height="50"
            />
          </td>
          <td>{{ item.name }}</td>
          <td>{{ item.description }}</td>
          <td>{{ item.member_count }}</td>
          <td>{{ calculation_time(item.created_at) }}</td>
          <td>
            <div class="d-flex gap-1">
              <button
                class="btn btn-outline-danger btn-sm"
                (click)="deleteGroup(item.id)"
              >
                <i class="bi bi-trash"></i>
              </button>
              <button class="btn btn-outline-primary btn-sm">
                <i class="bi bi-pencil-square"></i>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
