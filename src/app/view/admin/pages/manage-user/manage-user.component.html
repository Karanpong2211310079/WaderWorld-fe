<div class="container">
  <h2>Manage Users</h2>
  <table>
    <tr class="head-table">
      <th>ID</th>
      <th>Name</th>
      <th>Email</th>
      <th>Bio</th>
      <th>Create at</th>
      <th>Action</th>
    </tr>
    @for (item of AllUsers; track $index) {
    <tr>
      <td>{{ $index + 1 }}</td>
      <td>{{ item.username }}</td>
      <td>{{ item.email }}</td>
      <td>{{ item.bio }}</td>
      <td>{{ calculation_time(item.date_joined) }}</td>
      <td>
        <button class="btn btn-danger" (click)="delete_user(item.id)">
          <i class="bi bi-trash"></i>
        </button>

        <button class="btn btn-primary" (click)="openEditUserModal(item)">
          <i class="bi bi-pencil-square"></i>
        </button>
      </td>
    </tr>
    }
  </table>
</div>
