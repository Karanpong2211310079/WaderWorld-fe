<div class="card-body p-5">
  <h2 class="text-center mb-4 fw-bold text-primary">Edit User</h2>

  <form [formGroup]="userForm" (ngSubmit)="submitForm()">
    <input type="hidden" formControlName="user_id" />

    <!-- Profile Image Section -->
    <div class="mb-4 text-center">
      <div class="position-relative d-inline-block">
        <img
          *ngIf="userForm.value.image || imagePreview; else noImage"
          [src]="imagePreview || userForm.value.image"
          alt="Profile Image"
          class="rounded-circle shadow-sm border"
          style="width: 160px; height: 160px; object-fit: cover"
        />
        <ng-template #noImage>
          <div
            class="rounded-circle bg-light border d-flex align-items-center justify-content-center"
            style="width: 160px; height: 160px"
          >
            <i class="fas fa-user text-muted" style="font-size: 3rem"></i>
          </div>
        </ng-template>
      </div>

      <!-- Image Upload -->
      <div class="mt-3">
        <label class="form-label fw-semibold text-muted small"
          >Change Profile Image</label
        >
        <input
          type="file"
          class="form-control"
          accept="image/*"
          (change)="onFileSelected($event)"
        />
        <div *ngIf="imagePreview" class="mt-2">
          <button
            type="button"
            class="btn btn-sm btn-outline-danger"
            (click)="removeImage()"
          >
            Remove New Image
          </button>
        </div>
      </div>
    </div>

    <!-- Username -->
    <div class="mb-3">
      <label class="form-label fw-semibold">Username</label>
      <input
        type="text"
        class="form-control form-control-lg"
        formControlName="username"
        placeholder="Enter username"
      />
    </div>

    <!-- Email -->
    <div class="mb-3">
      <label class="form-label fw-semibold">Email</label>
      <input
        type="email"
        class="form-control form-control-lg"
        formControlName="email"
        placeholder="Enter email address"
      />
    </div>

    <!-- Bio -->
    <div class="mb-3">
      <label class="form-label fw-semibold">Bio</label>
      <textarea
        class="form-control"
        formControlName="bio"
        rows="4"
        placeholder="Tell us about yourself..."
      ></textarea>
    </div>

    <!-- Active Status -->
    <div class="mb-4">
      <div class="form-check form-switch">
        <input
          type="checkbox"
          class="form-check-input"
          formControlName="is_active"
          id="isActiveCheck"
          role="switch"
        />
        <label class="form-check-label fw-semibold" for="isActiveCheck">
          <span class="me-2">Account Status:</span>
          <span
            class="badge"
            [ngClass]="userForm.value.is_active ? 'bg-success' : 'bg-danger'"
          >
            {{ userForm.value.is_active ? "Active" : "Inactive" }}
          </span>
        </label>
      </div>
    </div>

    <!-- Submit Buttons -->
    <div class="d-flex gap-2">
      <button
        type="submit"
        class="btn btn-primary w-100 py-2 fs-5 fw-semibold"
        [disabled]="isSubmitting"
      >
        <span *ngIf="!isSubmitting">Update User</span>
        <span *ngIf="isSubmitting">
          <div class="spinner-border spinner-border-sm me-2"></div>
          Updating...
        </span>
      </button>

      <button
        type="button"
        class="btn btn-danger w-100 py-2 fs-5 fw-semibold"
        (click)="closeModal()"
        [disabled]="isSubmitting"
      >
        Cancel
      </button>
    </div>
  </form>
</div>
