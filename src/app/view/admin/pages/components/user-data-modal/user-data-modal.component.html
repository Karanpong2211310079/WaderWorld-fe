<div class="modal-header">
  <h5 class="modal-title">Edit User</h5>
  <button
    type="button"
    class="btn-close"
    aria-label="Close"
    (click)="closeModal()"
  ></button>
</div>

<div class="modal-body">
  <form [formGroup]="userForm" (ngSubmit)="submitForm()">
    <input type="hidden" formControlName="user_id" />

    <div class="mb-3 text-center">
      <img
        *ngIf="userForm.value.image; else noImage"
        [src]="userForm.value.image"
        alt="Profile Image"
        class="img-thumbnail"
        style="width: 120px; height: 120px; object-fit: cover"
      />
      <ng-template #noImage>
        <p class="text-muted">No profile image</p>
      </ng-template>
    </div>

    <!-- Username -->
    <div class="mb-3">
      <label>Username</label>
      <input class="form-control" formControlName="username" />
    </div>

    <!-- Email -->
    <div class="mb-3">
      <label>Email</label>
      <input type="email" class="form-control" formControlName="email" />
    </div>

    <!-- Bio -->
    <div class="mb-3">
      <label>Bio</label>
      <textarea class="form-control" formControlName="bio"></textarea>
    </div>

    <!-- Upload รูปใหม่ -->
    <div class="mb-3">
      <label>Change Profile Image</label>
      <input
        type="file"
        class="form-control"
        (change)="onFileSelected($event)"
      />
    </div>

    <!-- Active Checkbox -->
    <div class="form-check mb-3">
      <input
        type="checkbox"
        class="form-check-input"
        formControlName="is_active"
        id="isActiveCheck"
        [checked]="userForm.value.is_active"
      />
      <label class="form-check-label" for="isActiveCheck">Active</label>
    </div>

    <!-- Footer -->
    <div class="modal-footer">
      <button type="submit" class="btn btn-primary">Save</button>
      <button type="button" class="btn btn-secondary" (click)="closeModal()">
        Cancel
      </button>
    </div>
  </form>
</div>
