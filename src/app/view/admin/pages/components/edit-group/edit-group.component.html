<div class="card-body p-5">
  <h2 class="text-center mb-4 fw-bold text-primary">Edit Group</h2>

  <form [formGroup]="editgroupform">
    <!-- Group Name -->
    <div class="mb-3">
      <label class="form-label fw-semibold">Group Name</label>
      <input
        type="text"
        formControlName="name"
        class="form-control form-control-lg"
        placeholder="Enter group name"
      />
    </div>

    <!-- Description -->
    <div class="mb-3">
      <label class="form-label fw-semibold">Description</label>
      <textarea
        formControlName="description"
        rows="3"
        class="form-control"
        placeholder="Group description..."
      ></textarea>
    </div>

    <!-- Image Upload -->
    <div class="mb-3">
      <label class="form-label fw-semibold">Group Image</label>
      <input
        type="file"
        (change)="onImageSelected($event)"
        accept="image/*"
        class="form-control"
      />

      <!-- Current Image Display -->
      <div
        *ngIf="currentGroup.image_url && !imagePreview"
        class="mt-3 text-center"
      >
        <p class="text-muted small mb-2">Current Image:</p>
        <img
          [src]="currentGroup.image_url"
          class="rounded shadow-sm border"
          style="width: 160px; height: 160px; object-fit: cover"
        />
        <div class="mt-2">
          <button
            type="button"
            class="btn btn-sm btn-outline-danger"
            (click)="removeCurrentImage()"
          >
            Remove Current Image
          </button>
        </div>
      </div>

      <!-- New Image Preview -->
      <div *ngIf="imagePreview" class="mt-3 text-center">
        <p class="text-muted small mb-2">New Image Preview:</p>
        <img
          [src]="imagePreview"
          class="rounded shadow-sm border"
          style="width: 160px; height: 160px; object-fit: cover"
        />
        <div class="mt-2">
          <button
            type="button"
            class="btn btn-sm btn-outline-danger"
            (click)="removeNewImage()"
          >
            Remove New Image
          </button>
        </div>
      </div>
    </div>

    <!-- Category -->
    <div class="mb-4">
      <label class="form-label fw-semibold">Category</label>
      <select formControlName="category" class="form-select form-select-lg">
        <option value="BEACH">🏖️ Sea & Islands</option>
        <option value="MOUNTAIN">⛰️ Mountains & Hills</option>
        <option value="FOREST">🌳 Forest</option>
        <option value="TOURIST_SPOT">📍 Tourist Spots</option>
        <option value="CAMPING">🏕️ Camping</option>
        <option value="TEMPLE_MERIT">🛕 Temples & Merit Making</option>
        <option value="FOOD_CAFE">☕ Food & Cafes</option>
        <option value="THEME_WATER_PARK">🎢 Theme & Water Parks</option>
        <option value="ADVENTURE">🧗 Hiking & Adventure</option>
        <option value="NIGHTLIFE">🍻 Nightlife & Party</option>
        <option value="VOLUNTEERING">🤝 Volunteering</option>
        <option value="PHOTOGRAPHY">📸 Photography</option>
        <option value="CONCERT">🎤 Concerts</option>
        <option value="WATERFALL">🏞️ Waterfalls & Nature</option>
        <option value="CITY_TRIP">🏙️ City Sightseeing</option>
        <option value="DIVING">🤿 Diving</option>
        <option value="OTHER">❓ Other</option>
      </select>
    </div>

    <!-- Type -->
    <div class="mb-4">
      <label class="form-label fw-semibold">Group Type</label>
      <select formControlName="type" class="form-select form-select-lg">
        <option value="PUBLIC">🌍 Public</option>
        <option value="PRIVATE">🔒 Private</option>
      </select>
    </div>

    <!-- Submit -->
    <div class="d-flex gap-2">
      <button
        type="button"
        class="btn btn-primary w-100 py-2 fs-5 fw-semibold d-flex align-items-center justify-content-center"
        (click)="submitForm()"
        [disabled]="isSubmitting"
      >
        <span *ngIf="!isSubmitting">Update Group</span>

        <span *ngIf="isSubmitting" class="d-flex align-items-center">
          <div class="spinner-border spinner-border-sm me-2"></div>
          Updating...
        </span>
      </button>

      <button
        type="button"
        class="btn btn-danger w-100 py-2 fs-5 fw-semibold d-flex align-items-center justify-content-center"
        (click)="CancelEditGroup()"
        [disabled]="isSubmitting"
      >
        Cancel
      </button>
    </div>
  </form>
</div>
