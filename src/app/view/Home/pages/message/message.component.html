<div class="d-flex flex-row p-3 chat-wrapper">
  <!-- 🧩 Sidebar: Chat List -->
  <div class="col-lg-4 col-md-5 col-sm-12 pe-3">
    <div class="sidebar d-flex flex-column h-100 rounded shadow-sm p-3">
      <input
        type="text"
        class="form-control mb-3 search-input"
        placeholder="Search users..."
        [formControl]="searchControl"
      />
      <div class="chat-list flex-grow-1 overflow-auto">
        <div
          *ngFor="let chatroom of filteredMessage; trackBy: trackByChatroomId"
          class="chat-item d-flex flex-row align-items-center mb-3 p-2 rounded"
          [class.active]="selectedChatroom?.chatroomId === chatroom.chatroomId"
          (click)="selectChatroom(chatroom)"
        >
          <img
            [src]="chatroom.OtherImageUrl"
            alt="avatar"
            class="chat-avatar"
          />
          <div class="ms-3 chat-info">
            <h6 class="mb-0">{{ chatroom.OtherUsername }}</h6>
            <small class="text-muted last-message">{{
              chatroom.LastMessage || "No message yet"
            }}</small>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 💬 Main Chat -->
  <div class="col-lg-8 col-md-7 col-sm-12">
    <div
      class="main-chat d-flex flex-column h-100 bg-white rounded shadow-sm p-3"
      *ngIf="selectedChatroom; else noChatroom"
    >
      <!-- Header -->
      <div class="chat-header d-flex flex-row align-items-center mb-3">
        <div class="me-2 chat-icon"><i class="bi bi-chat-text fs-3"></i></div>
        <div>
          <h5 class="mb-0">{{ selectedChatroom.OtherUsername }}</h5>
          <small class="text-muted">{{
            selectedChatroom.LastMessageTime
          }}</small>
        </div>
      </div>

      <!-- Messages -->
      <div
        #chatContainer
        class="messages-container flex-grow-1 overflow-auto d-flex flex-column"
      >
        <div
          *ngFor="let msg of chatroom_messages; trackBy: trackByMessageId"
          class="message"
          [ngClass]="msg.sender_id == id ? 'sent' : 'received'"
        >
          <span class="message-bubble">
            {{ msg.content }}
          </span>
        </div>
      </div>

      <!-- Message Input Area -->
      <div class="input-area mt-auto">
        <div class="input-group">
          <span class="input-group-text emoji-icon"
            ><i class="bi bi-emoji-smile"></i
          ></span>
          <input
            type="text"
            class="form-control message-input"
            placeholder="Type a message..."
            [formControl]="sendMessageForm"
          />
          <button
            class="btn btn-primary send-btn"
            type="button"
            (click)="sendMessage()"
            [disabled]="isLoading"
          >
            <i class="bi bi-arrow-right-square-fill"></i>
          </button>
        </div>
      </div>
    </div>

    <ng-template #noChatroom>
      <div
        class="d-flex flex-column align-items-center justify-content-center h-100 text-muted"
      >
        <i class="bi bi-chat-dots fs-1 mb-3"></i>
        <p>Select a chatroom to start messaging</p>
      </div>
    </ng-template>
  </div>
</div>
