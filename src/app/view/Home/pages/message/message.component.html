<div class="d-flex flex-column p-3" style="min-height: 100vh; background-color: #f0f2f5;">
  <div class="row flex-grow-1 g-3">

    <!-- User Panel -->
    <div class="col-lg-4 col-md-5 col-sm-12">
      <div class="d-flex flex-column h-100 bg-white rounded shadow-sm p-3">
        <input type="text" class="form-control mb-3" placeholder="Search users...">

        <div class="flex-grow-1 overflow-auto">
          <div class="d-flex flex-row align-items-center mb-3 p-2 rounded" style="cursor:pointer;" >
            <img 
              src="https://i.pravatar.cc/150?img=3"
              alt="avatar" 
              class="rounded-circle"
              style="width:50px; height:50px; object-fit:cover;">
            <div class="ms-3">
              <h6 class="mb-0">karanpong</h6>
              <small class="text-muted">บัลลองดอร์ 8 สมัย</small>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Chat Panel -->
    <div class="col-lg-8 col-md-7 col-sm-12">
      <div class="d-flex flex-column h-100 bg-white rounded shadow-sm p-3">
        
        <!-- Chat Header -->
        <div class="d-flex flex-row align-items-center mb-3">
          <div class="me-2">
            <i class="bi bi-robot fs-3"></i>
          </div>
          <div>
            <h5 class="mb-0">ChatGPT</h5>
            <small class="text-muted">Model: GPT-3.5</small>
          </div>
        </div>

        <!-- Chat Messages -->
        <div class="flex-grow-1 bg-light rounded p-2 mb-3 overflow-auto">
          <div class="mb-2">
            <span class="badge bg-primary">Hello!</span>
          </div>
          <div class="mb-2 text-end">
            <span class="badge bg-secondary">Hi there!</span>
          </div>
        </div>

        <!-- Input -->
        <div class="d-flex">
          <div class="input-group">
            <span class="input-group-text bg-light">
              <i class="bi bi-emoji-smile"></i>
            </span>
            <input type="text" class="form-control" placeholder="Type a message...">
            <button class="btn btn-primary" type="button">
              <i class="bi bi-arrow-right-square-fill"></i>
            </button>
          </div>
        </div>

      </div>
    </div>

  </div>
</div>
