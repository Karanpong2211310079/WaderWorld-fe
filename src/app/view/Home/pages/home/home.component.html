<div class="d-flex flex-column p-3">
  <div class="d-flex flex-column p-3 rounded shadow-sm bg-white">
    <div class="d-flex align-items-center gap-2">
      <img
        class="rounded-circle"
        src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=80&h=80&fit=crop&crop=face"
        alt="User Avatar"
        width="50"
        height="50"
      />
      <input
        placeholder="What's on your mind?"
        type="text"
        class="flex-grow-1 border-0 bg-light rounded px-3 py-2"
        style="min-width: 0"
      />
    </div>
    <div class="d-flex justify-content-end align-items-center p-2 gap-2">
      <i class="bi bi-image-fill text-primary mx-2" style="font-size: 40px"></i>
      <button class="btn btn-primary">create</button>
    </div>
  </div>

  <!-- แก้ตรงนี้ -->

  <app-follow-btn
    [choice1]="'For You'"
    [choice2]="'Following'"
  ></app-follow-btn>

  <!-- <app-post></app-post> -->
  <div class="content mt-3">
    <app-post></app-post>
  </div>
</div>
