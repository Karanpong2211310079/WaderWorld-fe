<div class="d-flex flex-column p-3">
  <!-- แก้ตรงนี้ -->
  <app-create-user-post> </app-create-user-post>

  <app-follow-btn
    [choice1]="'For You'"
    [choice2]="'Following'"
  ></app-follow-btn>

  <div class="content mt-3">
    <ng-container *ngFor="let post of user_post">
      <app-user-post
        [group_post]="post"
        type="user"
        (postUpdated)="handlePostUpdated($event)"
      >
      </app-user-post>
    </ng-container>
  </div>
</div>
