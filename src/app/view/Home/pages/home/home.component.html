<div class="d-flex flex-column p-4">
  <!-- Post Creation Section -->
  <app-create-user-post></app-create-user-post>

  <!-- Selection Button for For You / Following -->
  <app-follow-btn
    [choice1]="'For You'"
    [choice2]="'Following'"
    (choiceChange)="onChoiceChanged($event)"
  ></app-follow-btn>

  <!-- Recommended New Groups -->
  <div class="mt-4" *ngIf="new_groups && new_groups.length > 0">
    <h5 class="section-title">Recommended New Groups</h5>

    <div class="d-flex gap-3 mt-2">
      <div
        *ngFor="let group of new_groups"
        class="group-card"
        (click)="goToGroup(group.id)"
      >
        <img
          *ngIf="group.image_url"
          [src]="group.image_url"
          class="card-img-top rounded"
          alt="{{ group.name }}"
        />
        <div class="card-body">
          <p class="card-title small mb-0 text-truncate">
            {{ group.name }}
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- Category Filter for For You -->
  <div class="d-flex gap-2 mt-3 category-container flex-wrap">
    <button
      *ngFor="let cat of categories"
      class="category-btn d-flex align-items-center gap-2"
      [ngStyle]="{
        'background-color': selectedCategory === cat.name ? cat.color : 'white',
        color: selectedCategory === cat.name ? 'white' : cat.color,
        'border-color': cat.color
      }"
      (click)="filterByCategory(cat.name)"
    >
      <span>{{ cat.icon }}</span>
      {{ cat.label }}
    </button>
  </div>

  <!-- Display Posts -->
  <div class="content mt-3">
    <ng-container *ngFor="let post of filtered_posts">
      <app-user-post
        [group_post]="post"
        type="user"
        (postUpdated)="handlePostUpdated($event)"
      >
      </app-user-post>
    </ng-container>
  </div>
</div>
