<div class="card-body p-5">
  <h2 class="text-center mb-4 fw-bold text-primary">Create New Group</h2>

  <form [formGroup]="createGroupForm">
    <!-- Group Name -->
    <div class="mb-3">
      <label class="form-label fw-semibold">Group Name</label>
      <input
        type="text"
        formControlName="group_name"
        class="form-control form-control-lg"
        placeholder="Enter group name"
      />
    </div>

    <!-- Description -->
    <div class="mb-3">
      <label class="form-label fw-semibold">Description</label>
      <textarea
        formControlName="description"
        rows="3"
        class="form-control"
        placeholder="Group description..."
      ></textarea>
    </div>

    <!-- Image Upload -->
    <div class="mb-3">
      <label class="form-label fw-semibold">Group Image</label>
      <input
        type="file"
        (change)="onImageSelected($event)"
        accept="image/*"
        class="form-control"
      />

      <div *ngIf="imagePreview" class="mt-3 text-center">
        <img
          [src]="imagePreview"
          class="rounded shadow-sm border"
          style="width: 160px; height: 160px; object-fit: cover"
        />
      </div>
    </div>

    <!-- Type -->
    <div class="mb-4">
      <label class="form-label fw-semibold">Group Type</label>
      <select formControlName="type" class="form-select form-select-lg">
        <option value="PUBLIC">Public</option>
        <option value="PRIVATE">Private</option>
      </select>
    </div>
    <!-- Category -->
    <div class="mb-4">
      <label class="form-label fw-semibold">Category</label>
      <select formControlName="category" class="form-select form-select-lg">
        <option value="BEACH">Beach</option>
        <option value="MOUNTAIN">Mountain</option>
        <option value="FOREST">Forest</option>
        <option value="TOURIST_SPOT">Tourist Spot</option>
        <option value="OTHER">Other</option>
        <option value="BEACH">BEACH</option>
        <option value="MOUNTAIN">MOUNTAIN</option>
        <option value="FOREST">FOREST</option>
        <option value="TOURIST_SPOT">TOURIST_SPOT</option>
        <option value="OTHER">OTHER</option>
      </select>
    </div>

    <!-- Submit -->
    <div class="d-flex gap-2">
      <button
        type="button"
        class="btn btn-primary w-100 py-2 fs-5 fw-semibold"
        (click)="submitForm()"
        [disabled]="isSubmitting"
      >
        <span *ngIf="!isSubmitting">Create Group</span>
        <span *ngIf="isSubmitting">
          <div class="spinner-border spinner-border-sm me-2"></div>
          Creating...
        </span>
      </button>

      <button
        type="button"
        class="btn btn-danger w-100 py-2 fs-5 fw-semibold"
        (click)="CancleCreateGroup()"
        [disabled]="isSubmitting"
      >
        Cancel
      </button>
    </div>
  </form>
</div>
