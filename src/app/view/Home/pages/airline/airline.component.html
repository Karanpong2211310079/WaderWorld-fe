<div class="container mt-3">
  <div class="row g-3">
    <div class="col-md-4" *ngFor="let airline of airlines">
      <div class="d-flex flex-column bg-white rounded shadow-sm p-3 h-100">
        <img
          [src]="airline.image"
          alt="{{ airline.name }}"
          class="rounded mb-3"
          style="height: 150px; object-fit: cover"
        />
        <h5>{{ airline.name }}</h5>
        <p class="text-muted flex-grow-1">{{ airline.description }}</p>
        <a
          [href]="airline.link"
          target="_blank"
          class="btn btn-primary mt-auto"
        >
          Visit Airline
        </a>
      </div>
    </div>
  </div>
</div>
