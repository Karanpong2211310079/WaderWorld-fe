<div class="d-flex flex-column shadow-sm rounded m-3 bg-white travel-card">
  <ol class="list-unstyled p-3 gap-3 d-flex flex-column">
    <h4 class="d-flex align-items-center gap-2 title">
      <i class="bi bi-airplane-fill text-primary"></i>
      Recommended Travelers
    </h4>

    <ng-container *ngFor="let user of recommendedUsers | slice : 0 : 3">
      <div
        class="d-flex justify-content-between align-items-center gap-2 traveler-item"
      >
        <div class="d-flex align-items-center gap-2">
          <img
            class="rounded-circle traveler-img"
            [src]="user.image_url || 'https://via.placeholder.com/40'"
            alt="{{ user.username }}"
          />
          <div class="d-flex flex-column">
            {{ user.username }}
          </div>
        </div>

        <button
          class="btn btn-sm btn-travel-follow"
          (click)="followUser(user.id)"
        >
          Follow
        </button>
      </div>
    </ng-container>
  </ol>
</div>
