<div
  class="d-flex flex-column shadow-sm rounded m-3 bg-white travel-card sticky-travel-card"
>
  <ol class="list-unstyled p-3 gap-3 d-flex flex-column">
    <h4 class="d-flex align-items-center gap-2 title">
      <i class="bi bi-star-fill text-warning"></i>
      Top Recommended Travelers
    </h4>

    <ng-container
      *ngFor="
        let user of recommendedUsers | slice : 0 : itemsToShow;
        let i = index
      "
    >
      <div
        class="d-flex justify-content-between align-items-center gap-2 traveler-item ranking-traveler"
        [attr.data-rank]="i + 1"
      >
        <!-- Rank Badge -->
        <div class="rank-badge-container">
          <div class="traveler-rank-badge">
            <i class="bi bi-person-fill"></i>
            <span class="rank-number">{{ i + 1 }}</span>
          </div>
        </div>

        <div class="d-flex align-items-center gap-3 flex-grow-1">
          <div class="profile-container">
            <img
              class="rounded-circle traveler-img"
              [src]="user.image_url"
              alt="{{ user.username }}"
            />
          </div>

          <div class="d-flex flex-column traveler-info">
            <span class="username">{{ user.username }}</span>
            <span class="rank-label">{{ getRankLabel(i + 1) }}</span>
          </div>
        </div>

        <button class="btn btn-sm btn-travel-follow" (click)="followUser(user)">
          <i class="bi bi-plus-circle me-1"></i>
          {{ user.isRequested ? "Requested" : "Follow" }}
        </button>
      </div>
    </ng-container>

    <!-- Show More Button -->
    <div class="text-center mt-2" *ngIf="itemsToShow < recommendedUsers.length">
      <button
        class="btn btn-outline-primary btn-sm show-more-btn"
        (click)="showMore()"
      >
        <i class="bi bi-chevron-down me-1"></i>
        Show More Travelers
      </button>
    </div>
  </ol>
</div>
