<div class="container-fluid bg-white shadow-sm">
  <div class="d-flex justify-content-between align-items-center p-3">
    <!-- Left: Brand + Search -->
    <form
      [formGroup]="searchform"
      class="position-relative d-flex align-items-center gap-3"
    >
      <div class="d-flex align-items-center gap-2 flex-grow-1">
        <h3
          class="brand mb-0 d-flex align-items-center"
          (click)="navigateToHome()"
        >
          <i class="bi bi-globe-americas me-2 text-primary"></i> WanderWorld
        </h3>

        <div class="search-box d-none d-md-flex align-items-center">
          <i class="bi bi-search search-icon"></i>
          <input
            type="text"
            class="form-control border-0 shadow-none"
            formControlName="username"
            placeholder="Search destination, people..."
          />
        </div>
      </div>

      <!-- Dropdown แสดงผล -->
      <ul
        *ngIf="searchform.value.username && user?.length > 0"
        class="list-group position-absolute shadow-sm dropdown-search bg-white"
      >
        <li
          class="list-group-item list-group-item-action d-flex align-items-center"
          *ngFor="let u of user"
          (click)="selectUser(u)"
        >
          <img
            *ngIf="u.image_url"
            [src]="u.image_url"
            class="rounded-circle me-2"
            width="30"
            height="30"
          />
          {{ u.username }}
        </li>
      </ul>
    </form>

    <!-- Right: Icons + Avatar -->
    <div class="d-flex align-items-center gap-4">
      <i class="bi bi-geo-alt travel-icon"></i>
      <i class="bi bi-airplane-fill travel-icon"></i>
      <i class="bi bi-camera-fill travel-icon"></i>

      <button class="btn btn-outline-danger logout-btn" (click)="Logout_btn()">
        <i class="bi bi-box-arrow-right"></i> Log out
      </button>

      <i class="bi bi-bell fs-4 notif-icon"></i>

      <div class="position-relative d-inline-block">
        <img
          class="rounded-circle img-fluid user-avatar"
          width="40"
          height="40"
          [src]="userImage"
          (click)="toggleUserMenu()"
        />

        <!-- dropdown -->
        <ul
          class="position-absolute bg-white shadow rounded p-2 list-unstyled user-menu"
          [class.d-none]="!userMenuOpen"
        >
          <li
            class="p-2 menu-item"
            (click)="navigateToProfile(); closeUserMenu()"
          >
            <i class="bi bi-person"></i> Profile
          </li>
          <li
            class="p-2 menu-item"
            (click)="navigateToDashboard(); closeUserMenu()"
          >
            <i class="bi bi-speedometer2"></i> Dashboard
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
