<div class="signup-container">
  <div class="signup-card">
    <div class="logo-container">
      <div class="logo-circle">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="32"
          height="32"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="8.5" cy="7" r="4"></circle>
          <line x1="20" y1="8" x2="20" y2="14"></line>
          <line x1="23" y1="11" x2="17" y2="11"></line>
        </svg>
      </div>
    </div>

    <h1 class="signup-title">Create Account</h1>
    <p class="signup-subtitle">Sign up to get started</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="signup-form">
      <!-- Username Field -->
      <div class="form-group">
        <label for="username" class="form-label">
          <svg
            class="label-icon"
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          Username
        </label>
        <div class="input-wrapper">
          <input
            type="text"
            id="username"
            formControlName="username"
            placeholder="Choose a username"
            class="form-input"
            [class.error]="
              form.get('username')?.errors && form.get('username')?.touched
            "
            autocomplete="username"
          />
        </div>
        <span
          class="error-message"
          *ngIf="form.get('username')?.errors && form.get('username')?.touched"
        >
          <span *ngIf="form.get('username')?.errors?.['required']"
            >Username is required</span
          >
          <span *ngIf="form.get('username')?.errors?.['minlength']"
            >Username must be at least 3 characters</span
          >
        </span>
      </div>

      <!-- Email Field -->
      <div class="form-group">
        <label for="email" class="form-label">
          <svg
            class="label-icon"
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
            ></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
          Email
        </label>
        <div class="input-wrapper">
          <input
            type="email"
            id="email"
            formControlName="email"
            placeholder="Enter your email"
            class="form-input"
            [class.error]="
              form.get('email')?.errors && form.get('email')?.touched
            "
            autocomplete="email"
          />
        </div>
        <span
          class="error-message"
          *ngIf="form.get('email')?.errors && form.get('email')?.touched"
        >
          <span *ngIf="form.get('email')?.errors?.['required']"
            >Email is required</span
          >
          <span *ngIf="form.get('email')?.errors?.['email']"
            >Please enter a valid email</span
          >
        </span>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password" class="form-label">
          <svg
            class="label-icon"
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          Password
        </label>
        <div class="password-input-container">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            formControlName="password"
            placeholder="Create a password"
            class="form-input password-input"
            [class.error]="
              form.get('password')?.errors && form.get('password')?.touched
            "
            autocomplete="new-password"
          />
          <button
            type="button"
            class="password-toggle"
            aria-label="Toggle password visibility"
          >
            <svg
              *ngIf="!showPassword"
              class="eye-icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg
              *ngIf="showPassword"
              class="eye-icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
              ></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
        <span
          class="error-message"
          *ngIf="form.get('password')?.errors && form.get('password')?.touched"
        >
          <span *ngIf="form.get('password')?.errors?.['required']"
            >Password is required</span
          >
          <span *ngIf="form.get('password')?.errors?.['minlength']"
            >Password must be at least 6 characters</span
          >
        </span>
      </div>

      <!-- Password Strength Indicator -->
      <div class="password-strength" *ngIf="form.get('password')?.value">
        <div class="strength-bar"></div>
      </div>

      <!-- Terms & Conditions -->
      <div class="terms-group">
        <label class="checkbox-label">
          <input
            type="checkbox"
            class="checkbox-input"
            formControlName="acceptTerms"
          />
          <span class="checkbox-text">
            I agree to the <a href="#" class="terms-link">Terms & Conditions</a>
          </span>
        </label>
        <span
          class="error-message"
          *ngIf="
            form.get('acceptTerms')?.errors && form.get('acceptTerms')?.touched
          "
        >
          You must accept the terms
        </span>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="create-account-btn"
        [disabled]="form.invalid || isLoading"
      >
        <span *ngIf="!isLoading">Create Account</span>
        <span *ngIf="isLoading" class="loading-text">Creating account</span>
      </button>
    </form>

    <!-- Divider -->
    <div class="divider">
      <span class="divider-text">or sign up with</span>
    </div>

    <!-- Social Signup -->
    <div class="social-login">
      <button type="button" class="social-btn">
        <svg width="20" height="20" viewBox="0 0 24 24">
          <path
            fill="#4285F4"
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
          />
          <path
            fill="#34A853"
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
          />
          <path
            fill="#FBBC05"
            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
          />
          <path
            fill="#EA4335"
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
          />
        </svg>
        Google
      </button>
      <button type="button" class="social-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#1877F2">
          <path
            d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"
          />
        </svg>
        Facebook
      </button>
    </div>

    <!-- Login Link -->
    <div class="login-link">
      <span class="login-text">Already have an account?</span>
      <button (click)="NavigateLogin()" type="button" class="login-btn">
        Sign in
      </button>
    </div>
  </div>
</div>
