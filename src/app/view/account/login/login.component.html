<div class="signup-container">
  <div class="signup-card">
    <div class="logo-container">
      <div class="logo-circle">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="32"
          height="32"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>
    </div>

    <h1 class="signup-title">Welcome Back</h1>
    <p class="signup-subtitle">Login to your account</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="signup-form">
      <!-- Username Field -->
      <div class="form-group">
        <label for="username" class="form-label">
          <svg
            class="label-icon"
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          Username
        </label>
        <div class="input-wrapper">
          <input
            type="text"
            id="username"
            formControlName="username"
            placeholder="Enter your username"
            class="form-input"
            autocomplete="username"
          />
        </div>
        <span
          class="error-message"
          *ngIf="form.get('username')?.errors && form.get('username')?.touched"
        >
          Username is required
        </span>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password" class="form-label">
          <svg
            class="label-icon"
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          Password
        </label>
        <div class="password-input-container">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            formControlName="password"
            placeholder="Enter your password"
            class="form-input password-input"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="password-toggle"
            aria-label="Toggle password visibility"
            (click)="togglePasswordVisibility()"
          >
            <svg
              *ngIf="!showPassword"
              class="eye-icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg
              *ngIf="showPassword"
              class="eye-icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
              ></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
        <span
          class="error-message"
          *ngIf="form.get('password')?.errors && form.get('password')?.touched"
        >
          Password is required
        </span>
      </div>

      <!-- Remember Me & Forgot Password -->
      <div class="form-options">
        <label class="checkbox-label">
          <input type="checkbox" class="checkbox-input" />
          <span class="checkbox-text">Remember me</span>
        </label>
        <button
          type="button"
          class="forgot-password-btn"
          (click)="NavigateForgotPass()"
        >
          Forgot password?
        </button>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="create-account-btn"
        [disabled]="form.invalid || isLoading"
      >
        <span *ngIf="!isLoading">Log in</span>
        <span *ngIf="isLoading" class="loading-text">Logging in</span>
      </button>
    </form>

    <!-- Divider -->
    <div class="divider">
      <span class="divider-text">or continue with</span>
    </div>

    <!-- Signup Link -->
    <div class="login-link">
      <span class="login-text">Don't have an account?</span>
      <button (click)="NavigateSignup()" type="button" class="login-btn">
        Sign up
      </button>
    </div>
  </div>
</div>
