<div class="signup-container">
  <div class="signup-card">
    <h1 class="signup-title">Login to your account</h1>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="signup-form">
      <!-- Username Field -->
      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <input
          type="text"
          id="username"
          formControlName="username"
          placeholder="Username"
          class="form-input"
        />
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <div class="password-input-container">
          <input
            id="password"
            formControlName="password"
            placeholder="Enter your password"
            class="form-input password-input"
          />
          <button type="button" class="password-toggle"></button>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="create-account-btn" (click)="onSubmit()">
        Log in
      </button>
    </form>

    <!-- Login Link -->
    <div class="login-link">
      <span class="login-text">Don't have an account?</span>
      <button (click)="NavigateSignup()" type="button" class="login-btn">
        Sign up
      </button>
    </div>
  </div>
</div>
